[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "sqlmodel~=0.0.48",
]

[project.optional-dependencies]
test = [
    "pyright~=1.1.414",
    "ruff~=0.17.3",
]

[project.scripts]
calculator-api = "server:main"

[tool.setuptools]
py-modules = ["server", "core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
