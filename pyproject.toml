[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "sqlalchemy==2.1.6",
    "sqlmodel==0.0.48",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "coverage==7.17.0",
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "setuptools==84.2.1",
]

[project.scripts]
calculator-api = "calculator_api.api:main"

[tool.setuptools]
package-dir = {calculator_api = "src/calculator_api"}
packages = ["calculator_api"]
py-modules = ["core", "server"]

[tool.pytest.ini_options]
addopts = [
    "--cov=calculator_api",
    "--cov=core",
    "--cov=server",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["calculator_api", "core", "server"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
exclude = ["build", "dist"]
extraPaths = ["src"]
include = ["src", "tests", "core.py", "server.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
