[build-system]
requires = ["setuptools~=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162.0",
    "pydantic~=2.14.3",
    "sqlmodel~=0.0.48",
    "uvicorn~=0.54.0",
]

[project.optional-dependencies]
test = [
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
    "coverage~=7.17.2",
    "httpx~=0.28.1",
]
dev = [
    "ruff~=0.17.4",
    "pyright~=1.1.414",
]

[project.scripts]
calculator-api = "server:main"

[tool.setuptools]
py-modules = ["server", "core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=server --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",  # interpreter-owned script guard; main() is tested directly
]
