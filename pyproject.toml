[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlmodel==0.0.48",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "pyright==1.1.414",
]

[project.scripts]
calculator-api = "server:main"

[tool.setuptools]
py-modules = ["server", "core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
    "--cov=core",
    "--cov=server",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["core", "server"]

[tool.coverage.report]
fail_under = 80
show_missing = true
