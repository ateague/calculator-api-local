[build-system]
requires = ["setuptools~=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-api"
version = "0.1.0"
description = "A simple calculator REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.162.0",
    "pydantic~=2.14.2",
    "uvicorn~=0.54.0",
    "sqlmodel~=0.0.48",
]

[project.optional-dependencies]
test = [
    "coverage~=7.17.0",
    "httpx~=0.28.1",
    "pytest~=9.2.0",
    "pytest-cov~=7.1.0",
]
dev = [
    "pyright~=1.1.414",
    "ruff~=0.17.3",
]

[project.scripts]
calculator-api = "server:main"

[tool.setuptools]
py-modules = ["server", "core"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=core",
    "--cov=server",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["core", "server"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
